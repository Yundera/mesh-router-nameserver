# Two-instance setup (prod): each instance announces both nameservers and serves
# both glue records. Enable on each host with, in its .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.peer.yml
#   NS_PEER=<the other instance's NS_HOST>
#   NS_PEER_IP=<the other instance's PUBLIC_IP>
services:
  nameserver:
    command:
      - -ns
      - .=${NS_HOST}.
      - -ns
      - .=${NS_PEER}.
      - -soa
      - ${NS_HOST}.,${SOA_RNAME}.,${SOA_SERIAL},900,900,604800,60
      - -a
      - ${NS_HOST}=${PUBLIC_IP}
      - -a
      - ${NS_PEER}=${NS_PEER_IP}
