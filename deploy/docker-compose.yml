# ip.<zone> nameserver — nip.io-style names (<app>-<ip>.ip.<zone> → <ip>), served by
# the sslip.io DNS server, unmodified. See ../docs/ip-names.md and ../docs/ip-names-rollout.md.
#
# One instance per host. Each host gets its own .env (see .env.example) and its own
# NS name in the parent zone (A <NS_HOST> → PUBLIC_IP, DNS only; NS ip → <NS_HOST>).
services:
  nameserver:
    # Pinned by digest: the image is only published as :latest.
    image: cunnie/sslip.io-dns-server@sha256:0c51490361aa5b5682b766d0d9e0e6644fc4a475b90e55e39a5a5b2a41503397
    restart: unless-stopped
    command:
      - -ns
      - .=${NS_HOST}.
      - -soa
      - ${NS_HOST}.,${SOA_RNAME}.,${SOA_SERIAL},900,900,604800,60
      - -a
      - ${NS_HOST}=${PUBLIC_IP}
    ports:
      # Bound to the public IP, not 0.0.0.0: systemd-resolved already holds 127.0.0.53/54:53.
      - "${PUBLIC_IP}:53:53/udp"
      - "${PUBLIC_IP}:53:53/tcp"
    cpu_shares: 256
    mem_limit: 128m
    # Every answer is logged; cap it so the container log can't grow unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
