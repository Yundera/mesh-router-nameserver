# Public nameserver: PowerDNS secondary of the backend's hidden primary (../primary/).
# Image ghcr.io/yundera/mesh-router-nameserver (this repo), ROLE=secondary. Serves:
#   - every zone in the primary's catalog (RFC 9432), received by NOTIFY + AXFR —
#     today the ip.<zone> allowlist, allow.<ip-zone>.invalid;
#   - ip.<zone> itself, a LOCAL zone made at start from env: a Lua wildcard (baked in)
#     that answers an IP-encoded name only for allowlisted IPs.
# One instance per public host, each with its own .env (see .env.example). This file
# reaches the primary over the internet (PRIMARY_IP = its host's public IP, PRIMARY_PORT
# = its published port). On the primary's own host add docker-compose.colocated.yml.
services:
  nameserver:
    image: ghcr.io/yundera/mesh-router-nameserver:1.3.1
    restart: unless-stopped
    environment:
      - ROLE=secondary
      - IP_ZONE=${IP_ZONE:?set IP_ZONE}
      - NS_HOSTS=${NS_HOSTS:?set NS_HOSTS}
      - SOA_RNAME=${SOA_RNAME:?set SOA_RNAME}
      - CATALOG_ZONE=${CATALOG_ZONE:?set CATALOG_ZONE}
      - PRIMARY_IP=${PRIMARY_IP:?set PRIMARY_IP}
      - PRIMARY_PORT=${PRIMARY_PORT:-53}
    volumes:
      - nameserver-data:/var/lib/powerdns
    ports:
      # Bound to the public IP, not 0.0.0.0: systemd-resolved already holds 127.0.0.53/54:53.
      - "${PUBLIC_IP:?set PUBLIC_IP}:${PUBLIC_PORT:-53}:53/udp"
      - "${PUBLIC_IP}:${PUBLIC_PORT:-53}:53/tcp"
    cpu_shares: 256
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nameserver-data:
