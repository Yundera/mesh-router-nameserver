# PowerDNS hidden primary — a sidecar to merge into the mesh-router-backend stack.
# The backend is its only writer (HTTP API, DnsZones.ts); the public nameservers
# (../secondary/) are its only readers (NOTIFY + AXFR). Nothing here is published to
# the internet and nothing here needs a backup: a fresh volume is rebuilt by the
# backend's next reconcile pass (zones are created on demand).
#
# Backend env to add:
#   PDNS_API_URL=http://pdns-primary:8081
#   PDNS_API_KEY=${PDNS_API_KEY}
#   DNS_IP_ZONE=ip.<zone>                 # served by the secondaries
#   DNS_ALLOW_GRACE_SECONDS=21600         # optional, default 6 h
#
# Stack .env: PDNS_API_KEY (random), DNS_SOA_NS (first public NS name, no dot),
# DNS_XFR_SUBNET (default 172.16.53.0/24), DNS_PRIMARY_IP (.10), DNS_SECONDARY_IPS
# (comma list, the secondaries' addresses as the primary sees them: .11 for the
# co-located one; a remote secondary adds its public IP and needs the commented
# port below, firewalled to it).
services:
  pdns-primary:
    image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
    restart: unless-stopped
    environment:
      - PDNS_AUTH_API_KEY=${PDNS_API_KEY:?set PDNS_API_KEY}
      - TEMPLATE_FILES=primary
      - DNS_SOA_NS=${DNS_SOA_NS:?set DNS_SOA_NS}
      - DNS_SECONDARY_IPS=${DNS_SECONDARY_IPS:-172.16.53.11}
    volumes:
      - pdns-primary-data:/var/lib/powerdns
      - ./pdns-primary/primary.j2:/etc/powerdns/templates.d/primary.j2:ro
    networks:
      # the backend reaches the API here: put mesh-router-backend on this network too
      pdns-api: {}
      dns-xfr:
        ipv4_address: ${DNS_PRIMARY_IP:-172.16.53.10}
    # ports:
    #   - "<host-ip>:5353:53/tcp"   # remote secondaries only (AXFR is TCP; NOTIFY goes out)
    cpu_shares: 256
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdns-primary-data:

networks:
  pdns-api:
  # shared with the co-located secondary, which joins it as an external network
  dns-xfr:
    name: dns-xfr
    ipam:
      config:
        - subnet: ${DNS_XFR_SUBNET:-172.16.53.0/24}
